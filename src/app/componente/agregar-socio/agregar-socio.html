<div class="agregar-socio-modal">

  <div class="agregar-socio-card">

    <div class="agregar-socio-header">
      <h3>REGISTRAR SOCIO</h3>

      <button type="button" class="btn-cerrar" (click)="cerrarModal()">
        ×
      </button>
    </div>

    <form class="agregar-socio-form">

      <div class="form-grid">

        <div class="form-group">
          <label>Primer nombre</label>
          <input
            type="text"
            [(ngModel)]="primer_nombre_usuario"
            name="primer_nombre_usuario"
            placeholder="Ingresa el primer nombre">
        </div>

        <div class="form-group">
          <label>Segundo nombre</label>
          <input
            type="text"
            [(ngModel)]="segundo_nombre_usuario"
            name="segundo_nombre_usuario"
            placeholder="Ingresa el segundo nombre">
        </div>

        <div class="form-group">
          <label>Apellidos</label>
          <input
            type="text"
            [(ngModel)]="apellidos_usuario"
            name="apellidos_usuario"
            placeholder="Ingresa los apellidos">
        </div>

        <div class="form-group">
          <label>DNI</label>
          <input
            type="text"
            [(ngModel)]="documento_identidad"
            name="documento_identidad"
            placeholder="Ingresa el DNI">
        </div>

        <div class="form-group">
          <label>Teléfono</label>
          <input
            type="text"
            [(ngModel)]="telefono"
            name="telefono"
            placeholder="Ingresa el teléfono">
        </div>

        <div class="form-group">
          <label>Correo</label>
          <input
            type="email"
            [(ngModel)]="email"
            name="email"
            placeholder="Ingresa el correo electrónico">
        </div>

        <div class="form-group">
          <label>Tipo de membresía</label>
          <select
            [(ngModel)]="tipo_membresia"
            name="tipo_membresia">
            <option value="">Selecciona un plan</option>
            <option value="Mensual">Mensual</option>
            <option value="Trimestral">Trimestral</option>
            <option value="Anual">Anual</option>
          </select>
        </div>

        <div class="form-group">
          <label>Contraseña</label>
          <input
            type="password"
            [(ngModel)]="contrasena"
            name="contrasena"
            placeholder="Crea una contraseña">
        </div>

      </div>

      <div class="agregar-socio-actions">
        <button type="button" class="btn-cancelar" (click)="cerrarModal()">
          CANCELAR
        </button>

        <button type="button" class="btn-guardar" (click)="registrarSocio()">
          GUARDAR SOCIO
        </button>
      </div>

    </form>

  </div>

</div>
