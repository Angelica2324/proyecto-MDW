<div class="modal-fondo">
  <div class="modal-card">

    <button type="button" class="modal-cerrar-x" (click)="cerrarModal()">×</button>

    <div class="modal-icono">
      ✓
    </div>

    <h2>CONFIRMACIÓN DE REGISTRO</h2>
    <div class="modal-linea"></div>

    <p class="modal-mensaje">La operación se realizó correctamente.</p>

    <div class="modal-dato">
      <span>Socio:</span>
      <strong>{{ socio }}</strong>
    </div>

    <div class="modal-dato">
      <span>Membresía:</span>
      <strong>{{ membresia }}</strong>
    </div>

    <div class="modal-dato">
      <span>Estado:</span>
      <strong>{{ estado }}</strong>
    </div>

    <button type="button" class="modal-btn-cerrar" (click)="cerrarModal()">
      CERRAR
    </button>

  </div>
</div>
