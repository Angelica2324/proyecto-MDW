<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">

<section class="container px-5 pb-5 modal-overlay">
  <div class="bg-white p-4" style="border-radius: 12px; box-shadow: 0 12px 18px rgba(0,0,0,0.05);">
    

    <div class="text-end">
      <button class="btn-close" (click)="cerrar.emit()"></button>
    </div>

    <h3 class="text-center fw-bold fs-5">Editar Socio</h3>
    <div class="underline"></div>

    <form class="registro-form pb-3 mb-4">

      <div class="mb-2">
        <label class="form-label">Primer nombre:</label>
        <input class="form-control" [(ngModel)]="usuario.primer_nombre_usuario" name="primer_nombre">
      </div>

      <div class="mb-2">
        <label class="form-label">Segundo nombre:</label>
        <input class="form-control" [(ngModel)]="usuario.segundo_nombre_usuario" name="segundo_nombre">
      </div>

      <div class="mb-2">
        <label class="form-label">Apellidos:</label>
        <input class="form-control" [(ngModel)]="usuario.apellidos_usuario" name="apellidos">
      </div>

      <div class="mb-2">
        <label class="form-label">DNI:</label>
        <input class="form-control" [(ngModel)]="usuario.documento_identidad" name="dni">
      </div>

      <div class="mb-2">
        <label class="form-label">Teléfono:</label>
        <input class="form-control" [(ngModel)]="usuario.telefono" name="telefono">
      </div>

      <div class="mb-2">
        <label class="form-label">Correo:</label>
        <input class="form-control" [(ngModel)]="usuario.email" name="email">
      </div>

      <div class="mb-2">
        <label class="form-label">Tipo de membresía:</label>
        <select class="form-control" [(ngModel)]="membresia.tipo_membresia" name="tipo_membresia">
          <option value="Mensual">Mensual</option>
          <option value="Trimestral">Trimestral</option>
          <option value="Anual">Anual</option>
        </select>
      </div>

      <div class="mb-2">
        <label class="form-label">Estado:</label>
        <select class="form-control" [(ngModel)]="usuario.estado" name="estado">
          <option [value]="true">Activo</option>
          <option [value]="false">Inactivo</option>
        </select>
      </div>

      <button type="button" class="btn btn-primary" (click)="guardar()">
        Guardar Cambios
      </button>

    </form>
  </div>
</section>
