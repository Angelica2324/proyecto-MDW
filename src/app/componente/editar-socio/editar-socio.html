<div class="editar-socio-modal">

  <div class="editar-socio-card">

    <div class="editar-socio-header">
      <h3>EDITAR SOCIO</h3>

      <button type="button" class="btn-cerrar" (click)="cerrarModal()">
        ×
      </button>
    </div>

    <form class="editar-socio-form">

      <div class="form-grid">

        <div class="form-group">
          <label>Primer nombre</label>
          <input
            type="text"
            [(ngModel)]="usuario.primer_nombre_usuario"
            name="primer_nombre_usuario"
            placeholder="Primer nombre">
        </div>

        <div class="form-group">
          <label>Segundo nombre</label>
          <input
            type="text"
            [(ngModel)]="usuario.segundo_nombre_usuario"
            name="segundo_nombre_usuario"
            placeholder="Segundo nombre">
        </div>

        <div class="form-group">
          <label>Apellidos</label>
          <input
            type="text"
            [(ngModel)]="usuario.apellidos_usuario"
            name="apellidos_usuario"
            placeholder="Apellidos">
        </div>

        <div class="form-group">
          <label>DNI</label>
          <input
            type="text"
            [(ngModel)]="usuario.documento_identidad"
            name="documento_identidad"
            placeholder="DNI">
        </div>

        <div class="form-group">
          <label>Teléfono</label>
          <input
            type="text"
            [(ngModel)]="usuario.telefono"
            name="telefono"
            placeholder="Teléfono">
        </div>

        <div class="form-group">
          <label>Correo</label>
          <input
            type="email"
            [(ngModel)]="usuario.email"
            name="email"
            placeholder="Correo electrónico">
        </div>

        <div class="form-group">
          <label>Tipo de membresía</label>
          <select
            [(ngModel)]="membresia.tipo_membresia"
            name="tipo_membresia">
            <option value="Mensual">Mensual</option>
            <option value="Trimestral">Trimestral</option>
            <option value="Anual">Anual</option>
          </select>
        </div>

        <div class="form-group">
          <label>Estado</label>
          <select
            [(ngModel)]="usuario.estado"
            name="estado">
            <option [ngValue]="true">Activo</option>
            <option [ngValue]="false">Inactivo</option>
          </select>
        </div>

      </div>

      <div class="editar-socio-actions">
        <button type="button" class="btn-cancelar" (click)="cerrarModal()">
          CANCELAR
        </button>

        <button type="button" class="btn-guardar" (click)="guardar()">
          GUARDAR CAMBIOS
        </button>
      </div>

    </form>

  </div>

</div>
