<div class="editar-modal">

  <div class="editar-card">

    <div class="editar-header">
      <h3>EDITAR ENTRENADOR</h3>

      <button type="button" class="btn-cerrar" (click)="cerrarEditar()">
        ×
      </button>
    </div>

    <form class="editar-form">

      <div class="form-grid">

        <div class="form-group">
          <label>Primer nombre</label>
          <input
            type="text"
            [(ngModel)]="usuarioCompleto.primer_nombre_usuario"
            name="primer_nombre_usuario"
            placeholder="Primer nombre">
        </div>

        <div class="form-group">
          <label>Segundo nombre</label>
          <input
            type="text"
            [(ngModel)]="usuarioCompleto.segundo_nombre_usuario"
            name="segundo_nombre_usuario"
            placeholder="Segundo nombre">
        </div>

        <div class="form-group">
          <label>Apellidos</label>
          <input
            type="text"
            [(ngModel)]="usuarioCompleto.apellidos_usuario"
            name="apellidos_usuario"
            placeholder="Apellidos">
        </div>

        <div class="form-group">
          <label>DNI</label>
          <input
            type="text"
            [(ngModel)]="usuarioCompleto.documento_identidad"
            name="documento_identidad"
            placeholder="DNI">
        </div>

        <div class="form-group">
          <label>Teléfono</label>
          <input
            type="text"
            [(ngModel)]="usuarioCompleto.telefono"
            name="telefono"
            placeholder="Teléfono">
        </div>

        <div class="form-group">
          <label>Correo</label>
          <input
            type="email"
            [(ngModel)]="usuarioCompleto.email"
            name="email"
            placeholder="Correo electrónico">
        </div>

        <div class="form-group">
          <label>Especialidad</label>
          <input
            type="text"
            [(ngModel)]="usuarioCompleto.especialidad"
            name="especialidad"
            placeholder="Especialidad">
        </div>

        <div class="form-group">
          <label>Estado</label>
          <select
            [(ngModel)]="usuarioCompleto.estado"
            name="estado">
            <option [ngValue]="true">Activo</option>
            <option [ngValue]="false">Inactivo</option>
          </select>
        </div>

        <div class="form-group full">
          <label>Fecha de registro</label>
          <input
            type="text"
            [(ngModel)]="usuarioCompleto.fecha_registro"
            name="fecha_registro"
            placeholder="Fecha de registro"
            disabled>
        </div>

      </div>

      <div class="editar-actions">
        <button type="button" class="btn-cancelar" (click)="cerrarEditar()">
          CANCELAR
        </button>

        <button type="button" class="btn-guardar" (click)="guardar()">
          GUARDAR CAMBIOS
        </button>
      </div>

    </form>

  </div>

</div>
