<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">

<div class="container px-5 pb-5">
  <div class="bg-white p-4" style="border-radius: 12px; box-shadow: 0 12px 18px rgba(0,0,0,0.05);">
    
    <div class="text-end"> 
            <button class="btn-close" (click)="cerrar.emit()" f-black> </button>
          </div>
    
    <form>
      <h3 class="text-center fw-bold fs-5">Editar Entrenador</h3>

      <div class="mb-2">
        <label class="form-label">Primer nombre:</label>
        <input class="form-control" [(ngModel)]="usuarioCompleto.primer_nombre_usuario" name="primer_nombre">
      </div>

      <div class="mb-2">
        <label class="form-label">Segundo nombre:</label>
        <input class="form-control" [(ngModel)]="usuarioCompleto.segundo_nombre_usuario" name="segundo_nombre">
      </div>

      <div class="mb-2">
        <label class="form-label">Apellidos:</label>
        <input class="form-control" [(ngModel)]="usuarioCompleto.apellidos_usuario" name="apellidos">
      </div>

      <div class="mb-2">
        <label class="form-label">DNI:</label>
        <input class="form-control" [(ngModel)]="usuarioCompleto.documento_identidad" name="dni">
      </div>

      <div class="mb-2">
        <label class="form-label">Teléfono:</label>
        <input class="form-control" [(ngModel)]="usuarioCompleto.telefono" name="telefono">
      </div>

      <div class="mb-2">
        <label class="form-label">Especialidad:</label>
        <input class="form-control" [(ngModel)]="usuarioCompleto.especialidad" name="especialidad">
      </div>

      <div class="mb-2">
        <label class="form-label">Correo:</label>
        <input class="form-control" [(ngModel)]="usuarioCompleto.email" name="email">
      </div>

      <div class="mb-2">
        <label class="form-label">Estado:</label>
        <select class="form-select" [(ngModel)]="usuarioCompleto.estado" name="estado">
          <option [value]="true">Activo</option>
          <option [value]="false">Inactivo</option>
        </select>
      </div>

      <div class="mb-2">
        <label class="form-label">Fecha de registro:</label>
        <input class="form-control" [(ngModel)]="usuarioCompleto.fecha_registro" name="fecha_registro" disabled>
      </div>

      <div class="text-end mt-3">   
        <button type="button" class="btn btn-primary" (click)="guardar()">Guardar</button>
      </div>
    </form>
  </div>
</div>
