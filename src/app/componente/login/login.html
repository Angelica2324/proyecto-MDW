<header class="navbar">
  <div class="logo">
    🏋️ XTREME FITNESS CENTER
  </div>

  <div class="nav-buttons">
    <button class="btn btn-register">👤 Registro</button>
  </div>
</header>

<section class="login-section">
  <div class="login-card">

    <button type="button" class="btn-volver" (click)="volver()">← Volver</button>

    <h2>INICIAR SESIÓN</h2>
    <div class="underline"></div>

    <form class="login-form">

      <label>Usuario / Correo:</label>
      <div class="input-group">
        <span>✉️</span>
        <input type="text" name="correo" [(ngModel)]="correo" placeholder="Ingresa tu correo o usuario">
      </div>

      <label>Contraseña:</label>
      <div class="input-group">
        <span>🔒</span>
        <input type="password" name="contrasena" [(ngModel)]="contrasena" placeholder="Ingresa tu contraseña">
      </div>

      <button type="button" class="btn-ingresar" (click)="ingresar()">
        ↪ INGRESAR
      </button>

      <a href="#" class="olvide">¿Olvidaste tu contraseña?</a>

    </form>

  </div>
</section>
