<header class="navbar">
  <div class="logo">
    🏋️ XTREME FITNESS CENTER
  </div>

  <div class="nav-buttons">
    <button class="btn btn-login" (click)="irALogin()">↪ Login</button>
    <button class="btn btn-register" (click)="irARegistro()">👤 Registro</button>
  </div>
</header>

<main class="main-content">

  <section class="hero-title">
    <h1>TRANSFORMA TU CUERPO, MEJORA TU VIDA</h1>
  </section>

  <section class="hero-banner">
    <div class="banner-overlay">
      <div class="banner-buttons">
        <button class="btn-main btn-red" (click)="irARegistro()">👤 Registrarse</button>
        <button class="btn-main btn-outline" (click)="irALogin()">↪ Iniciar sesión</button>
      </div>
    </div>
  </section>

  <section class="services">
  <button type="button" class="service-item" (click)="abrirServicio('clases')">
    <span>👥</span>
    <p>Clases</p>
  </button>

  <div class="line"></div>

  <button type="button" class="service-item" (click)="abrirServicio('rutinas')">
    <span>📋</span>
    <p>Rutinas</p>
  </button>

  <div class="line"></div>

  <button type="button" class="service-item" (click)="abrirServicio('membresias')">
    <span>💳</span>
    <p>Membresías</p>
  </button>

  <div class="line"></div>

  <button type="button" class="service-item" (click)="abrirServicio('horarios')">
    <span>📅</span>
    <p>Horarios</p>
  </button>
</section>

</main>

@if (mostrarModalServicio) {
  <div class="modal-servicio-fondo">
    <div class="modal-servicio-card">

      <button type="button" class="modal-servicio-x" (click)="cerrarModalServicio()">×</button>

      <div class="modal-servicio-icono">
        ℹ
      </div>

      <h2>{{ tituloServicio }}</h2>
      <div class="modal-servicio-linea"></div>

      <p class="modal-servicio-mensaje">
        {{ descripcionServicio }}
      </p>

      <div class="modal-servicio-lista">
        <p>{{ detalleServicio1 }}</p>
        <p>{{ detalleServicio2 }}</p>
        <p>{{ detalleServicio3 }}</p>
      </div>

      <button type="button" class="modal-servicio-boton" (click)="cerrarModalServicio()">
        CERRAR
      </button>

    </div>
  </div>
}
