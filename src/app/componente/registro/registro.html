<div class="registro-page">

  <!-- NAVBAR -->
  <nav class="navbar">
    <div class="navbar-brand">
      <span class="brand-icon">⚡</span>
      <span class="brand-name">XTREME FITNESS CENTER</span>
    </div>

    <div class="navbar-actions">
      <a class="btn-ghost" (click)="irLogin.emit()">
        INICIAR SESIÓN
      </a>
    </div>
  </nav>

  <!-- CONTENIDO PRINCIPAL -->
  <div class="registro-container">

    <a class="btn-ghost" (click)="volverInicio.emit()">
      VOLVER AL INICIO
    </a>

    <div class="registro-header">
      <h1>REGISTRO DE <span class="highlight">NUEVO SOCIO</span></h1>
      <div class="titulo-linea"></div>
      <p class="subtitulo">Únete y construye tu mejor versión</p>
    </div>

    <div class="form-card">

      <!-- NOMBRES -->
      <div class="form-row">
        <div class="form-group">
          <label>PRIMER NOMBRE</label>
          <div class="input-wrapper">
            <span class="input-icon">👤</span>
            <input type="text" [(ngModel)]="primer_nombre_usuario" placeholder="Ingresa tu primer nombre" />
          </div>
        </div>

        <div class="form-group">
          <label>SEGUNDO NOMBRE</label>
          <div class="input-wrapper">
            <span class="input-icon">👤</span>
            <input type="text" [(ngModel)]="segundo_nombre_usuario" placeholder="Ingresa tu segundo nombre" />
          </div>
        </div>
      </div>

      <!-- APELLIDOS -->
      <div class="form-group full-width">
        <label>APELLIDOS</label>
        <div class="input-wrapper">
          <span class="input-icon">👤</span>
          <input type="text" [(ngModel)]="apellidos_usuario" placeholder="Ingresa tus apellidos" />
        </div>
      </div>

      <!-- DNI Y TELEFONO -->
      <div class="form-row">
        <div class="form-group">
          <label>DNI</label>
          <div class="input-wrapper">
            <span class="input-icon">💳</span>
            <input type="text" [(ngModel)]="documento_identidad" placeholder="Ingresa tu DNI" />
          </div>
        </div>

        <div class="form-group">
          <label>TELÉFONO</label>
          <div class="input-wrapper">
            <span class="input-icon">📞</span>
            <input type="text" [(ngModel)]="telefono" placeholder="Ingresa tu teléfono" />
          </div>
        </div>
      </div>

      <!-- EMAIL -->
      <div class="form-group full-width">
        <label>CORREO ELECTRÓNICO</label>
        <div class="input-wrapper">
          <span class="input-icon">✉️</span>
          <input type="email" [(ngModel)]="email" placeholder="Ingresa tu correo electrónico" />
        </div>
      </div>

      <!-- MEMBRESÍA -->
      <div class="form-group full-width">
        <label>TIPO DE MEMBRESÍA</label>
        <div class="input-wrapper select-wrapper">
          <span class="input-icon">💳</span>
          <select [(ngModel)]="tipo_membresia">
            <option value="" disabled selected>Selecciona un plan</option>
            <option value="Mensual">Plan Básico</option>
            <option value="Trimestral">Plan Premium</option>
            <option value="Anual">Plan Elite</option>
          </select>
        </div>
      </div>

      <!-- CONTRASEÑA -->
      <div class="form-group full-width">
        <label>CONTRASEÑA</label>
        <div class="input-wrapper">
          <span class="input-icon">🔒</span>
          <input type="password" [(ngModel)]="contrasena" placeholder="Crea tu contraseña" />
        </div>
      </div>

      <!-- TERMINOS -->
      <div class="terminos">
        <input type="checkbox" id="terminos" />
        <label for="terminos">
          Acepto los <span class="link-rojo">términos y condiciones</span>
        </label>
      </div>

      <!-- BOTON REGISTRAR -->
      <button class="btn-registrar" (click)="registrarSocio()">
        ⚡ REGISTRAR SOCIO
      </button>

    </div>

    <!-- LOGIN LINK -->
    <p class="ya-cuenta">
      ¿Ya tienes cuenta?
      <a class="link-rojo" (click)="irLogin.emit()">Haz clic aquí</a>
    </p>

  </div>
</div>
