<header class="navbar">
  <div class="logo">
    🏋️ XTREME FITNESS CENTER
  </div>

  <div class="nav-buttons">
    <button class="btn btn-login">↪ Login</button>
  </div>
</header>

<section class="registro-section">
  <div class="registro-card">

    <button type="button" class="btn-volver" (click)="volver()">← Volver al inicio</button>

    <h2>REGISTRO DE NUEVO SOCIO</h2>
    <div class="underline"></div>

    <form class="registro-form">

      <label>Primer nombre:</label>
      <div class="input-group">
        <span>👤</span>
        <input [(ngModel)]="primer_nombre_usuario" name="primer_nombre_usuario" type="text" placeholder="Ingresa tu primer nombre">
      </div>

      <label>Segundo nombre:</label>
      <div class="input-group">
        <span>👤</span>
        <input [(ngModel)]="segundo_nombre_usuario" name="segundo_nombre_usuario" type="text" placeholder="Ingresa tu segundo nombre">
      </div>

      <label>Apellidos:</label>
      <div class="input-group">
        <span>👤</span>
        <input [(ngModel)]="apellidos_usuario" name="apellidos_usuario" type="text" placeholder="Ingresa tus apellidos">
      </div>

      <label>DNI:</label>
      <div class="input-group">
        <span>🪪</span>
        <input [(ngModel)]="documento_identidad" name="documento_identidad" type="text" placeholder="Ingresa tu DNI">
      </div>

      <label>Teléfono:</label>
      <div class="input-group">
        <span>📞</span>
        <input [(ngModel)]="telefono" name="telefono" type="text" placeholder="Ingresa tu teléfono">
      </div>

      <label>Correo electrónico:</label>
      <div class="input-group">
        <span>✉️</span>
        <input [(ngModel)]="email" name="email" type="email" placeholder="Ingresa tu correo electrónico">
      </div>

      <label>Tipo de membresía:</label>
      <div class="input-group">
        <span>💳</span>
        <select [(ngModel)]="tipo_membresia" name="tipo_membresia">
          <option value="">Selecciona un plan</option>
          <option value="Mensual">Mensual</option>
          <option value="Trimestral">Trimestral</option>
          <option value="Anual">Anual</option>
        </select>
      </div>

      <label>Contraseña:</label>
      <div class="input-group">
        <span>🔒</span>
        <input [(ngModel)]="contrasena" name="contrasena" type="text" placeholder="Crea tu contraseña">
      </div>

      <div class="terminos">
        <input type="checkbox">
        <p>Acepto los <a href="#">términos y condiciones</a></p>
      </div>

      <button
        type="button"
        class="btn-registrar"
        (click)="registrarSocio()" >
        👥 REGISTRAR SOCIO
      </button>

    </form>
  </div>
</section>
